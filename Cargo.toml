[package]
name = "smtui"
version = "0.2.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
arboard = { version = "3.7.0", optional = true }
base64 = "0.23.1"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
dirs = "7.0.0"
futures = "0.3.34"
portable-pty = "0.9.0"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "process"] }
toml = "1.2.1"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
tui-term = "0.3.4"
unicode-width = "0.2.3"
vt100 = "0.16"
whoami = "2.1.3"

[features]
default = []
# Local desktop clipboard (needs X11/Wayland/macOS); off for servers.
local-clipboard = ["dep:arboard"]

[dev-dependencies]
tempfile = "3.27.0"
